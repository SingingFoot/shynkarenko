    <path d="M 50,84 L 69.23,35.69 A 52,52 0 0 1 71.81,36.8 Z" fill="#3a0e00"/>
    <path d="M 50,84 L 81.44,42.58 A 52,52 0 0 1 83.63,44.34 Z" fill="#3a0e00"/>
